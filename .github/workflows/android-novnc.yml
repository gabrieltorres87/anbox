name: Android Emulator with noVNC

on:
  workflow_dispatch:

jobs:
  android-emulator:
    # If KVM is unavailable on this runner, use a larger Linux runner
    # or a self-hosted runner with nested virtualization enabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_USER_HOME: ${{ github.workspace }}/android-user
      ANDROID_AVD_HOME: ${{ github.workspace }}/android-user/avd
      DISPLAY: :99
      AVD_NAME: github-emulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            unzip \
            git \
            xvfb \
            x11vnc \
            x11-utils \
            fluxbox \
            libpulse0 \
            libglu1-mesa \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libxtst6 \
            libxdamage1 \
            libxfixes3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-shape0

      - name: Enable KVM
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner user: $(id -un)"
          id

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is not available on this runner."
            echo "Use a runner with hardware virtualization or nested virtualization."
            exit 1
          fi

          sudo groupadd --system kvm 2>/dev/null || true

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-android-kvm.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

          # Apply permissions immediately for the current job.
          sudo chmod 0666 /dev/kvm

          echo "KVM device:"
          ls -l /dev/kvm

          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The current user cannot read/write /dev/kvm."
            exit 1
          fi

          echo "KVM is available and accessible."

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$ANDROID_SDK_ROOT/cmdline-tools" \
            "$ANDROID_USER_HOME" \
            "$ANDROID_AVD_HOME"

          {
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            echo "$ANDROID_SDK_ROOT/platform-tools"
            echo "$ANDROID_SDK_ROOT/emulator"
          } >> "$GITHUB_PATH"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/android-cmdline-tools
          mkdir -p /tmp/android-cmdline-tools

          wget --no-verbose \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/android-cmdline-tools.zip

          unzip -q \
            /tmp/android-cmdline-tools.zip \
            -d /tmp/android-cmdline-tools

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -R \
            /tmp/android-cmdline-tools/cmdline-tools/. \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      - name: Accept Android licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create Android Virtual Device
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$ANDROID_USER_HOME" \
            "$ANDROID_AVD_HOME"

          rm -rf "$ANDROID_AVD_HOME/${AVD_NAME}.avd"
          rm -f "$ANDROID_AVD_HOME/${AVD_NAME}.ini"

          echo "no" | avdmanager create avd \
            --name "$AVD_NAME" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6" \
            --force

          AVD_DIR="$ANDROID_AVD_HOME/${AVD_NAME}.avd"
          AVD_CONFIG="$AVD_DIR/config.ini"

          test -d "$AVD_DIR"
          test -f "$AVD_CONFIG"

          cat >> "$AVD_CONFIG" <<'EOF'
          hw.keyboard=yes
          hw.lcd.width=1280
          hw.lcd.height=800
          hw.lcd.density=240
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=4096M
          fastboot.forceColdBoot=yes
          fastboot.forceChosenSnapshotBoot=no
          snapshot.present=false
          showDeviceFrame=no
          skin.dynamic=yes
          EOF

          echo "Available AVDs:"
          emulator -list-avds

          if ! emulator -list-avds | grep -Fxq "$AVD_NAME"; then
            echo "AVD is not visible to emulator"
            find "$ANDROID_USER_HOME" -maxdepth 6 -print || true
            exit 1
          fi

      - name: Start Xvfb
        shell: bash
        run: |
          set -Eeuo pipefail

          Xvfb "$DISPLAY" \
            -screen 0 1280x800x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo "XVFB_PID=$!" >> "$GITHUB_ENV"

          sleep 3

          xdpyinfo -display "$DISPLAY" >/dev/null

      - name: Start window manager
        shell: bash
        run: |
          set -Eeuo pipefail

          fluxbox \
            > /tmp/fluxbox.log 2>&1 &

          echo "FLUXBOX_PID=$!" >> "$GITHUB_ENV"

          sleep 2

      - name: Start Android Emulator
        shell: bash
        run: |
          set -Eeuo pipefail

          adb kill-server || true
          adb start-server

          emulator \
            -avd "$AVD_NAME" \
            -accel on \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -camera-back none \
            -camera-front none \
            -netfast \
            -memory 2048 \
            -cores 2 \
            > /tmp/emulator.log 2>&1 &

          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> "$GITHUB_ENV"

          echo "Emulator PID: $EMULATOR_PID"

          timeout 300 bash -c '
            while true; do
              echo "----- adb devices -----"
              adb devices -l || true

              if adb devices | awk '\''NR > 1 && $2 == "device" { found=1 } END { exit !found }'\''; then
                echo "ADB device connected"
                break
              fi

              if ! kill -0 "$1" 2>/dev/null; then
                echo "Emulator process exited"
                cat /tmp/emulator.log || true
                exit 1
              fi

              echo "Waiting for emulator ADB connection..."
              sleep 5
            done
          ' _ "$EMULATOR_PID"

          echo "Waiting for Android framework to finish booting..."

          START_TIME=$(date +%s)
          BOOT_TIMEOUT=300

          while true; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator exited during boot"
              cat /tmp/emulator.log || true
              exit 1
            fi

            BOOT_ANIMATION=$(
              adb shell getprop init.svc.bootanim 2>/dev/null |
              tr -d "\r\n" || true
            )

            PACKAGE_MANAGER_READY=$(
              adb shell pm path android 2>/dev/null |
              grep -c '^package:' || true
            )

            SYS_BOOT_COMPLETED=$(
              adb shell getprop sys.boot_completed 2>/dev/null |
              tr -d "\r\n" || true
            )

            DEV_BOOT_COMPLETE=$(
              adb shell getprop dev.bootcomplete 2>/dev/null |
              tr -d "\r\n" || true
            )

            echo \
              "sys.boot_completed=$SYS_BOOT_COMPLETED " \
              "dev.bootcomplete=$DEV_BOOT_COMPLETE " \
              "init.svc.bootanim=$BOOT_ANIMATION " \
              "package_manager=$PACKAGE_MANAGER_READY"

            if [[ "$PACKAGE_MANAGER_READY" -gt 0 ]] &&
               [[ "$BOOT_ANIMATION" == "stopped" ]]; then
              echo "Android framework is ready"
              break
            fi

            NOW=$(date +%s)

            if (( NOW - START_TIME >= BOOT_TIMEOUT )); then
              echo "Android failed to finish booting"

              echo "----- adb devices -----"
              adb devices -l || true

              echo "----- Android properties -----"
              adb shell getprop || true

              echo "----- package manager -----"
              adb shell pm path android || true

              echo "----- Android processes -----"
              adb shell ps -A | grep -E \
                'system_server|zygote|surfaceflinger|package' || true

              echo "----- emulator log -----"
              cat /tmp/emulator.log || true

              exit 1
            fi

            sleep 5
          done

          adb wait-for-device

          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell input keyevent 82 || true

          echo "Android emulator is ready"

      - name: Verify emulator
        shell: bash
        run: |
          set -Eeuo pipefail

          adb devices -l
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.model

      - name: Start VNC server
        shell: bash
        run: |
          set -Eeuo pipefail

          x11vnc \
            -display "$DISPLAY" \
            -rfbport 5900 \
            -forever \
            -shared \
            -nopw \
            -listen 127.0.0.1 \
            > /tmp/x11vnc.log 2>&1 &

          X11VNC_PID=$!
          echo "X11VNC_PID=$X11VNC_PID" >> "$GITHUB_ENV"

          sleep 3

          if ! kill -0 "$X11VNC_PID" 2>/dev/null; then
            cat /tmp/x11vnc.log
            exit 1
          fi

      - name: Install and start noVNC
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf /tmp/noVNC

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/noVNC

          /tmp/noVNC/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            > /tmp/novnc.log 2>&1 &

          NOVNC_PID=$!
          echo "NOVNC_PID=$NOVNC_PID" >> "$GITHUB_ENV"

          sleep 5

          if ! kill -0 "$NOVNC_PID" 2>/dev/null; then
            cat /tmp/novnc.log
            exit 1
          fi

          curl \
            --silent \
            --fail \
            --max-time 10 \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          wget --no-verbose \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -O /tmp/cloudflared

          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start public noVNC tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!
          echo "CLOUDFLARED_PID=$CLOUDFLARED_PID" >> "$GITHUB_ENV"

          PUBLIC_URL=""

          for i in {1..60}; do
            PUBLIC_URL=$(
              grep -oE \
                'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.log |
              head -n 1 ||
              true
            )

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              cat /tmp/cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          NOVNC_URL="${PUBLIC_URL}/vnc.html"

          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"

          {
            echo "## Android Emulator"
            echo
            echo "Open noVNC:"
            echo
            echo "$NOVNC_URL"
          } >> "$GITHUB_STEP_SUMMARY

          echo "noVNC URL: $NOVNC_URL"

      - name: Run Android tests
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Android emulator is running"
          echo "noVNC URL: $NOVNC_URL"

          # Add tests here:
          # ./gradlew connectedDebugAndroidTest
          # adb install app/build/outputs/apk/debug/app-debug.apk

      - name: Keep emulator alive
        shell: bash
        run: |
          set -Eeuo pipefail

          for i in {1..270}; do
            if ! adb get-state >/dev/null 2>&1; then
              echo "Android emulator disconnected"
              exit 1
            fi

            if ! curl \
              --silent \
              --fail \
              --max-time 5 \
              http://127.0.0.1:6080/vnc.html \
              >/dev/null; then
              echo "noVNC is unavailable"
              exit 1
            fi

            if [[ -n "${CLOUDFLARED_PID:-}" ]] &&
               ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "Cloudflare Tunnel stopped"
              exit 1
            fi

            sleep 10
          done

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          if-no-files-found: ignore
          path: |
            /tmp/xvfb.log
            /tmp/fluxbox.log
            /tmp/emulator.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
