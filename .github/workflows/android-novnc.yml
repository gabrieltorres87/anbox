name: Android Emulator with noVNC

on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      DISPLAY: :99

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            unzip \
            git \
            xvfb \
            x11vnc \
            fluxbox \
            libpulse0 \
            libglu1-mesa \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libxtst6 \
            libxdamage1 \
            libxfixes3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-shape0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK paths
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -e

          rm -rf /tmp/android-cmdline-tools
          mkdir -p /tmp/android-cmdline-tools

          wget --no-verbose \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/android-cmdline-tools.zip

          unzip -q \
            /tmp/android-cmdline-tools.zip \
            -d /tmp/android-cmdline-tools

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -R \
            /tmp/android-cmdline-tools/cmdline-tools/. \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          chmod +x \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"

          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"

      - name: Verify Android command-line tools
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          command -v sdkmanager
          command -v avdmanager

          echo "sdkmanager version:"
          sdkmanager --version

          echo "avdmanager version:"
          avdmanager version || true

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # sdkmanager exits successfully after accepting licenses.
          # The yes process can then receive SIGPIPE, so pipefail must be disabled.
          set +o pipefail

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses

          echo "Android SDK licenses accepted"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Verify installed Android packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --list_installed

          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          test -d "$ANDROID_SDK_ROOT/system-images/android-35/google_apis/x86_64"

      - name: Create Android Virtual Device
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android/avd"

          rm -rf "$HOME/.android/avd/github-emulator.avd"
          rm -f "$HOME/.android/avd/github-emulator.ini"

          echo "no" | avdmanager create avd \
            --name "github-emulator" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6" \
            --force \
            --sdk_root="$ANDROID_SDK_ROOT"

      - name: Verify Android Virtual Device
        shell: bash
        run: |
          avdmanager list avd

      - name: Start Xvfb virtual display
        shell: bash
        run: |
          Xvfb "$DISPLAY" \
            -screen 0 1280x800x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

      - name: Start window manager
        shell: bash
        run: |
          fluxbox > /tmp/fluxbox.log 2>&1 &
          sleep 2

      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          nohup emulator \
            -avd github-emulator \
            -no-snapshot \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > /tmp/emulator.log 2>&1 &

          adb wait-for-device

          timeout 300 bash -c '
            until adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
              echo "Waiting for Android to boot..."
              sleep 5
            done
          '

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo "Android emulator is ready"

      - name: Verify emulator
        shell: bash
        run: |
          adb devices
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.model

      - name: Start VNC server
        shell: bash
        run: |
          x11vnc \
            -display "$DISPLAY" \
            -rfbport 5900 \
            -forever \
            -shared \
            -nopw \
            -listen 127.0.0.1 \
            > /tmp/x11vnc.log 2>&1 &

          sleep 3

      - name: Install and start noVNC
        shell: bash
        run: |
          set -e

          rm -rf /tmp/noVNC

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/noVNC

          /tmp/noVNC/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            > /tmp/novnc.log 2>&1 &

          sleep 5

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -e

          wget --no-verbose \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -O /tmp/cloudflared

          chmod +x /tmp/cloudflared

      - name: Start public noVNC tunnel
        shell: bash
        run: |
          set -e

          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          PUBLIC_URL=""

          for i in {1..30}; do
            PUBLIC_URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Cloudflare Tunnel failed to start"
            cat /tmp/cloudflared.log
            exit 1
          fi

          NOVNC_URL="$PUBLIC_URL/vnc.html"

          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "Open this URL in your browser:"
          echo "$NOVNC_URL"
          echo "=============================================="
          echo

      - name: Run Android tests
        shell: bash
        run: |
          echo "Android emulator is running."
          echo "noVNC URL: $NOVNC_URL"

          # Add your tests here.
          #
          # Example:
          # ./gradlew connectedDebugAndroidTest
          #
          # Install an APK:
          # adb install app/build/outputs/apk/debug/app-debug.apk
          #
          # Launch an application:
          # adb shell am start -n com.example.app/.MainActivity

      - name: Keep emulator alive
        shell: bash
        run: |
          echo "Open this URL while the job is running:"
          echo "$NOVNC_URL"

          for i in {1..270}; do
            sleep 10
          done

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          path: |
            /tmp/xvfb.log
            /tmp/fluxbox.log
            /tmp/emulator.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
          if-no-files-found: ignore
