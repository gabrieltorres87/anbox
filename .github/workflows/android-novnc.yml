name: Android Emulator with noVNC

on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      DISPLAY: :99

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            unzip \
            git \
            xvfb \
            x11vnc \
            fluxbox \
            libpulse0 \
            libglu1-mesa \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libxtst6 \
            libxdamage1 \
            libxfixes3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-shape0

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/android-cmdline-tools.zip

          unzip -q /tmp/android-cmdline-tools.zip \
            -d "$ANDROID_SDK_ROOT/cmdline-tools"

          mv \
            "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Verify Android tools
        run: |
          sdkmanager --version
          java -version

      - name: Accept Android licenses
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create Android Virtual Device
        run: |
          echo "no" | avdmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            create avd \
            --force \
            --name "github-emulator" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

      - name: Start Xvfb virtual display
        run: |
          Xvfb "$DISPLAY" \
            -screen 0 1280x800x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

      - name: Start window manager
        run: |
          fluxbox \
            > /tmp/fluxbox.log 2>&1 &

          sleep 2

      - name: Start Android Emulator
        run: |
          nohup emulator \
            -avd github-emulator \
            -no-snapshot \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > /tmp/emulator.log 2>&1 &

          adb wait-for-device

          timeout 300 bash -c '
            until adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
              echo "Waiting for Android to boot..."
              sleep 5
            done
          '

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo "Android emulator is ready"

      - name: Start VNC server
        run: |
          x11vnc \
            -display "$DISPLAY" \
            -rfbport 5900 \
            -forever \
            -shared \
            -nopw \
            -listen 127.0.0.1 \
            > /tmp/x11vnc.log 2>&1 &

          sleep 3

      - name: Install and start noVNC
        run: |
          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            /tmp/noVNC

          /tmp/noVNC/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 6080 \
            > /tmp/novnc.log 2>&1 &

          sleep 5

      - name: Install Cloudflare Tunnel
        run: |
          wget -q \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" \
            -O /tmp/cloudflared

          chmod +x /tmp/cloudflared

      - name: Start public noVNC tunnel
        run: |
          /tmp/cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          for i in {1..30}; do
            NOVNC_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)

            if [ -n "$NOVNC_URL" ]; then
              echo
              echo "=============================================="
              echo "Open this URL in your browser:"
              echo "$NOVNC_URL/vnc.html"
              echo "=============================================="
              echo

              echo "NOVNC_URL=$NOVNC_URL/vnc.html" >> "$GITHUB_ENV"
              break
            fi

            sleep 2
          done

          if [ -z "${NOVNC_URL:-}" ]; then
            echo "Cloudflare Tunnel did not start"
            cat /tmp/cloudflared.log
            exit 1
          fi

      - name: Run tests
        run: |
          # Put your Android tests here.
          #
          # Examples:
          # adb install app/build/outputs/apk/debug/app-debug.apk
          # adb shell am start -n com.example/.MainActivity
          # ./gradlew connectedDebugAndroidTest

          echo "Emulator is available at:"
          echo "$NOVNC_URL"

      - name: Keep emulator alive
        run: |
          echo "The emulator will remain available for approximately 45 minutes."
          echo "noVNC URL: $NOVNC_URL"

          for i in {1..270}; do
            sleep 10
          done

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          path: |
            /tmp/xvfb.log
            /tmp/fluxbox.log
            /tmp/emulator.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
          if-no-files-found: ignore
